<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EFE3">
<title>Admin sign in | Zakheera HR Assistant</title>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="login-wrap">
  <section class="card">
    <div class="hero">
      <h1 class="brand-row">
        <span class="mark"><img src="/static/img/logo.png" alt=""></span>
        <span class="lockup"><span class="lk-name">Zakheera</span><span class="lk-sub">Admin Panel</span></span>
      </h1>
      <p>Sign in with your work account (HR and CEO) or an admin username.</p>
    </div>
    <form class="form" id="form" autocomplete="on">
      <label for="u">Work email or admin username</label>
      <input id="u" type="text" placeholder="name@zakheera.ai" name="username" autocomplete="username" autocapitalize="none" required>
      <label for="p">Password</label>
      <div class="field">
        <input id="p" type="password" name="password" autocomplete="current-password" required>
        <button type="button" class="btn btn-ghost" id="toggle" style="min-width:72px">Show</button>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="go" type="submit">Sign in</button>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
$('toggle').onclick = () => { const s = $('p').type === 'password'; $('p').type = s ? 'text' : 'password'; $('toggle').textContent = s ? 'Hide' : 'Show'; };
$('form').addEventListener('submit', async e => {
  e.preventDefault(); $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Signing in...';
  try {
    const r = await fetch('/api/admin/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username: $('u').value, password: $('p').value})});
    if (r.ok) { location.href = '/admin'; return; }
    const d = await r.json().catch(() => ({})); $('err').textContent = typeof d.detail === 'string' ? d.detail : 'Could not sign in.';
  } catch (_) { $('err').textContent = 'Could not reach the server.'; }
  $('go').disabled = false; $('go').textContent = 'Sign in';
});
</script>
</body>
</html>
