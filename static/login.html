<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EFE3">
<title>Sign in | Zakheera HR Assistant</title>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="login-wrap">
  <section class="card">
    <div class="hero">
      <h1 class="brand-row">
        <span class="mark"><img src="/static/img/logo.png" alt=""></span>
        <span class="lockup"><span class="lk-name">Zakheera</span><span class="lk-sub">HR Assistant</span></span>
      </h1>
      <p>Sign in with your work account to ask about policies and your own records.</p>
    </div>
    <form class="form" id="form" autocomplete="on">
      <label for="email">Work email</label>
      <input id="email" type="email" name="email" placeholder="name@zakheera.ai" autocomplete="username" required>
      <label for="password">Password</label>
      <div class="field">
        <input id="password" type="password" name="password" autocomplete="current-password" required>
        <button type="button" class="btn btn-ghost" id="toggle" aria-label="Show password" style="min-width:72px">Show</button>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="go" type="submit">Sign in</button>
      <details class="demo" id="demo" hidden>
        <summary>Try a demo account</summary>
        <div class="demo-list" id="demo-list"></div>
      </details>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
$('toggle').onclick = () => {
  const show = $('password').type === 'password';
  $('password').type = show ? 'text' : 'password';
  $('toggle').textContent = show ? 'Hide' : 'Show';
};
$('form').addEventListener('submit', async e => {
  e.preventDefault(); $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'Signing in...';
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email: $('email').value, password: $('password').value})});
    if (r.ok) { location.href = '/'; return; }
    const d = await r.json().catch(() => ({}));
    $('err').textContent = d.detail || 'Could not sign in.';
  } catch (_) { $('err').textContent = 'Could not reach the server. Check your connection.'; }
  $('go').disabled = false; $('go').textContent = 'Sign in';
});
fetch('/api/demo-logins').then(r => r.json()).then(d => {
  if (!d.accounts || !d.accounts.length) return;
  $('demo').hidden = false;
  for (const a of d.accounts) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'demo-item';
    const t = document.createElement('b'); t.textContent = a.label + ': ' + a.name;
    const s = document.createElement('span'); s.textContent = a.email;
    b.append(t, s);
    b.onclick = () => { $('email').value = a.email; $('password').value = a.password; $('go').focus(); };
    $('demo-list').appendChild(b);
  }
}).catch(() => {});
</script>
</body>
</html>
